<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Intro section with dropdown navigation</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <header>
    <a href="#">
      <img src="images/logo.svg" class="logo" alt="logo">
    </a>
    <div class="mobile-menu">
      <nav class="nav-list">
        <div class="nav-item" >
          <button class="nav-link" type="button">
             Features
            <img src="images/icon-arrow-down.svg"  class="down-arrow" alt="down-arrow">
            <img src="images/icon-arrow-up.svg"  class="up-arrow" alt="up-arrow"">
          </button>
          <div class="dropdown-items features">
            <div class="dropdown-item">
              <img src="images/icon-todo.svg" alt="to-do">
              <p>Todo List</p>
            </div>
            <div class="dropdown-item">
              <img src="images/icon-calendar.svg" alt="to-do">
              <p>Calender</p>
            </div>
            <div class="dropdown-item">
              <img src="images/icon-reminders.svg" alt="to-do">
              <p>Reminders</p>
            </div>
            <div class="dropdown-item">
              <img src="images/icon-planning.svg" alt="to-do">
              <p>Planning</p>
            </div>
           </div>
        </div>  
        <div class="nav-item " >
          <button class="nav-link" type="button">
             Company
            <img src="images/icon-arrow-down.svg"  class="down-arrow" alt="down-arrow">
            <img src="images/icon-arrow-up.svg"  class="up-arrow" alt="up-arrow">
          </button>
           <div class="dropdown-items company-items">
            <div class="dropdown-item company">
              <p>History</p>
              <p>Our Team</p>
              <p>Blog</p>
            </div>
           </div>
        </div> 
        <a href="#">Careers </a>
        <a href="#">About </a>
        
      </nav>
      <div class="login-cta">
          <button type="button" class="login">Login</button>
          <button type="button" class="register">Register</button>
      </div>
    </div>
    <div class="menu">
      <button type="button" aria-label="Open menu" class="menu-btn"><img src="images/icon-menu.svg" alt=""></button>
      <button type="button" aria-label="Close menu" class="close-btn"><img src="images/icon-close-menu.svg" alt=""></button>

    </div>
    
  </header>
  <main>
    <section class="hero">
      <article class="hero-content">
         <h1 >Make remote work</h1>
         <p class="hero-description">Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
         <button class="hero-button" type="button"> Learn more</button>
         <div class="hero-clients">
          <div class="img-wrapper">
            <img src="images/client-databiz.svg" alt="databiz">
          </div>
          <div class="img-wrapper">
            <img src="images/client-audiophile.svg" alt="audiophile">
          </div>
          <div class="img-wrapper">
            <img src="images/client-meet.svg" alt="meet">
          </div>
          <div class="img-wrapper">
            <img src="images/client-maker.svg" alt="maker">
          </div>
        </div>
      </article>
      <article class="hero-image">
        <picture>
          <source srcset="images/image-hero-desktop.png" media="(min-width: 48rem)">
          <img src="images/image-hero-mobile.png" alt="img">
        </picture>
      </article>
    </section>

  </main>
  <footer></footer>
 
  
  <script src="script.js"></script>
</body>
</html>
<!-- 
  Make remote work

  Get your team in sync, no matter your location. Streamline processes, 
  create team rituals, and watch productivity soar.

  Learn more-->
